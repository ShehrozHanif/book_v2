name: Deploy Textbook to GitHub Pages

on:
  push:
    branches: [main, release/003-personalization-complete]
    paths:
      - 'frontend/textbook-site/**'
      - 'textbook/chapters/**'
      - '.github/workflows/deploy-textbook.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/textbook-site/**'
      - 'textbook/chapters/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/textbook-site

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/textbook-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build textbook site
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/textbook-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
