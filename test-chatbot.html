<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 20px;
        }

        .status {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .status.checking {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status.ok {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .response {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .response.show {
            display: block;
        }

        .response h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .response pre {
            background: white;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            border: 1px solid #ddd;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .messages {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .message.user {
            background: #e3f2fd;
            color: #1565c0;
            text-align: right;
        }

        .message.bot {
            background: #f5f5f5;
            color: #333;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 RAG Chatbot Tester</h1>
            <p>Test the chatbot API directly</p>
        </div>

        <div class="content">
            <div id="status" class="status checking">
                🔄 Checking backend connection...
            </div>

            <div class="form-group">
                <label for="apiUrl">API URL:</label>
                <input
                    type="text"
                    id="apiUrl"
                    value="http://localhost:8000"
                    placeholder="http://localhost:8000"
                >
            </div>

            <div class="form-group">
                <label for="query">Your Question:</label>
                <textarea
                    id="query"
                    placeholder="Ask a question about the textbook... e.g., 'What is ROS 2?'"
                ></textarea>
            </div>

            <button id="sendBtn" onclick="sendMessage()" disabled>Send Message</button>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Waiting for response...</p>
            </div>

            <div id="response" class="response">
                <h3>Bot Response:</h3>
                <pre id="responseText"></pre>
            </div>

            <div class="messages" id="messages"></div>
        </div>
    </div>

    <script>
        const apiUrlInput = document.getElementById('apiUrl');
        const queryInput = document.getElementById('query');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');
        const responseDiv = document.getElementById('response');
        const responseText = document.getElementById('responseText');
        const messagesDiv = document.getElementById('messages');

        let conversationId = null;

        // Check backend on page load
        window.addEventListener('load', checkBackend);
        apiUrlInput.addEventListener('change', checkBackend);

        async function checkBackend() {
            const apiUrl = apiUrlInput.value || 'http://localhost:8000';
            try {
                statusDiv.className = 'status checking';
                statusDiv.textContent = '🔄 Checking backend...';

                const response = await fetch(`${apiUrl}/health`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    statusDiv.className = 'status ok';
                    statusDiv.textContent = `✅ Backend is running! Status: ${data.status}`;
                    sendBtn.disabled = false;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Backend error: ${error.message}. Make sure backend is running at ${apiUrlInput.value}`;
                sendBtn.disabled = true;
            }
        }

        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query) {
                alert('Please enter a question');
                return;
            }

            const apiUrl = apiUrlInput.value || 'http://localhost:8000';

            // Add user message to display
            addMessage(query, 'user');
            queryInput.value = '';

            loadingDiv.classList.add('active');
            responseDiv.classList.remove('show');

            try {
                const response = await fetch(`${apiUrl}/api/v1/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        conversation_id: conversationId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                // Save conversation ID for follow-ups
                conversationId = data.conversation_id;

                // Add bot message
                addMessage(data.response, 'bot');

                // Show full response
                responseText.textContent = JSON.stringify(data, null, 2);
                responseDiv.classList.add('show');

            } catch (error) {
                addMessage(`Error: ${error.message}`, 'error');
            } finally {
                loadingDiv.classList.remove('active');
            }
        }

        function addMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Allow Enter key to send
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
                sendMessage();
            }
        });
    </script>
</body>
</html>
