version: '3.9'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: personalization-db
    environment:
      POSTGRES_USER: ${DB_USER:-personalization}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-personalization_secure_password}
      POSTGRES_DB: ${DB_NAME:-personalization_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-personalization} -d ${DB_NAME:-personalization_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personalization-network
    restart: unless-stopped
    labels:
      com.personalization.service: "database"

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: personalization-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personalization-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    labels:
      com.personalization.service: "cache"

  # FastAPI Application Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personalization-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-personalization}:${DB_PASSWORD:-personalization_secure_password}@postgres:5432/${DB_NAME:-personalization_db}
      DATABASE_POOL_MODE: queuepool
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_HOST: ${QDRANT_HOST:-localhost}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${WORKERS:-4}

    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/logs:/app/logs
      - ./backend/alembic:/app/alembic:ro

    ports:
      - "${API_PORT:-8000}:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - personalization-network

    restart: unless-stopped

    labels:
      com.personalization.service: "api"
      com.personalization.version: "1.0.0"

volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local

networks:
  personalization-network:
    driver: bridge
