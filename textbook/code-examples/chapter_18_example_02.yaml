  references:
    - "ISO 13482:2014 - Robots and robotic devices - Safety requirements for personal care robots"
    - "ISO/TS 15066:2016 - Robots and robotic devices - Collaborative robots"
    - "ISO 10218-1:2011 - Robots and robotic devices - Safety requirements for industrial robots"
    - "ANSI/RIA R15.08-2020 - Industrial Mobile Robots - Safety Requirements"
    - "IEC 60601-1:2012 - Medical electrical equipment - General safety requirements"
